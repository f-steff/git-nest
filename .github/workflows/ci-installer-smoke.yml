name: Installer smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release tarball
    runs-on: ubuntu-latest
    outputs:
      tarball: git-nest-test.tar.gz
      sha256: ${{ steps.hash.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create release tarball (contents of bin/)
        run: |
          tar -czf git-nest-test.tar.gz -C bin .
          sha256sum git-nest-test.tar.gz > SHA256SUMS

      - name: Compute artifact hash for the install jobs
        id: hash
        run: echo "sha=$(awk '{print $1}' SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Upload tarball for the install jobs
        uses: actions/upload-artifact@v5
        with:
          name: release-tarball
          path: |
            git-nest-test.tar.gz
            SHA256SUMS

  install:
    name: Install and verify (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository (for bin/install.sh)
        uses: actions/checkout@v5

      - name: Download the built tarball
        uses: actions/download-artifact@v5
        with:
          name: release-tarball
          path: artifact

      - name: Verify tarball checksum
        shell: bash
        run: |
          cd artifact
          sha256sum -c SHA256SUMS

      - name: Install git-nest
        shell: bash
        run: sh bin/install.sh --prefix "$RUNNER_TEMP/gn-prefix" --from "artifact/git-nest-test.tar.gz"

      - name: Verify the installed tool
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/gn-prefix/bin:$PATH"
          git-nest version
          git-nest help >/dev/null
          echo "installer smoke test OK on ${{ matrix.os }}"
