name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (optional; defaults to the version.md entry)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  version-check:
    name: Verify version bumped upward
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      is_release: ${{ steps.gate.outputs.value }}
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract current version
        id: version
        run: |
          V=$(sed -n 's/^GIT_NEST_VERSION=//p' bin/git-nest-main.sh | head -n 1)
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Current version: $V"

      # Releases are manual: dispatching this workflow is an explicit
      # release request, so a version that is not strictly newer than the
      # last release tag fails the workflow with a clear message instead
      # of silently skipping. PR CI runs the same gate via test_0004.
      - name: Verify version is newer than the last release tag
        id: gate
        run: |
          if sh scripts/package/version-check.sh; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No release: GIT_NEST_VERSION is not newer than the last release tag. Bump bin/git-nest-main.sh, version.md, and docs/site/_config.yml first."
            exit 1
          fi

  assemble:
    name: Assemble artifacts
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.is_release == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Assemble distribution artifacts
        run: sh scripts/package/assemble.sh --out dist

      - name: Upload assembled artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version-check, assemble]
    if: needs.version-check.outputs.is_release == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download assembled artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      # Creates both the vX.Y.Z tag and the GitHub Release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version-check.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          NOTES_FILE=/tmp/release-notes.md
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$NOTES_FILE"
          else
            # The newest version.md entry only (from the first "## x.y.z"
            # heading to the next one).
            awk '/^## / { if (n++) exit } { print }' version.md > "$NOTES_FILE"
            [ -s "$NOTES_FILE" ] || echo "git-nest $VERSION" > "$NOTES_FILE"
          fi
          gh release create "v$VERSION" \
            --title "git-nest $VERSION" \
            --notes-file "$NOTES_FILE" \
            "dist/git-nest-$VERSION.tar.gz" \
            "dist/git-nest-$VERSION.zip" \
            "dist/SHA256SUMS"

  tag-ci:
    name: Trigger tag CI for Pages badges
    runs-on: ubuntu-latest
    needs: [version-check, release]
    if: needs.version-check.outputs.is_release == 'true'
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version-check.outputs.version }}
    steps:
      - name: Dispatch full CI suites on the release tag
        run: |
          gh workflow run ci-linux.yml --ref "v$VERSION" --repo "${{ github.repository }}"
          gh workflow run ci-macos.yml --ref "v$VERSION" --repo "${{ github.repository }}"
          gh workflow run ci-windows.yml --ref "v$VERSION" --repo "${{ github.repository }}"

  pages:
    name: Update Pages
    uses: ./.github/workflows/pages.yml
    needs: [version-check, release]
    if: needs.version-check.outputs.is_release == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
