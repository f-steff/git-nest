name: CI (Windows fast)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: CI (Windows fast)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run platform-focused test set
        shell: bash
        run: sh tests/run-all-tests.sh --stop-on-fail only 0000,0004,0100,2090,3000,3010,3020,3030

      - name: Upload test results and log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows-fast
          path: |
            run-all-tests-results.md
            run-all-tests.log
