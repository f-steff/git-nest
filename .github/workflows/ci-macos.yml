name: CI (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests + static analysis
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests and static analysis
        run: sh tests/run-all-tests.sh only 0000,0004

      - name: Upload test results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: |
            run-all-tests-results.md
            run-all-tests.log
