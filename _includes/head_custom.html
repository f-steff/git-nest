<link rel="icon" type="image/svg+xml" href="{{ '/assets/logo.svg' | relative_url }}">
<style>
  /* The sidebar logo is a background-image on .site-logo (see the logo
     setting in _config.yml), so it cannot react to prefers-color-scheme
     itself. The logo is a dark badge with light text; invert it in dark
     mode to keep the contrasting-badge look. */
  @media (prefers-color-scheme: dark) {
    .site-logo { filter: invert(1); }
  }

  /* Sidebar header (see _includes/title.html): the badge logo on top with
     the site title text below, stacked vertically. */
  .site-title {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
  }
  .site-logo {
    width: 100%;
    height: auto;
    aspect-ratio: 180 / 80;
  }
  .site-title-label {
    font-size: 1rem;
    line-height: 1.2;
  }
  @media (min-width: 50rem) {
    .site-header {
      height: auto;
      max-height: none;
    }
  }

  /* Sidebar status section (version + CI badges) and the GitHub link;
     see _includes/components/sidebar.html and nav_footer_custom.html. */
  .side-bar-custom .site-status {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.375rem;
    padding: 1rem 2rem;
    border-bottom: 1px solid rgba(128, 128, 128, 0.35);
  }
  .side-bar-custom .site-status img {
    height: 1.125rem;
    width: auto;
  }
  .side-bar-custom .site-status-version {
    font-size: 0.75rem;
  }
  @media (min-width: 50rem) {
    .side-bar-custom .site-nav {
      padding-top: 1rem;
    }
  }
  .github-link {
    font-size: 0.875rem !important;
  }
</style>
