# git-nest unit test coverage classification.
# Functions listed in [untested] are deliberately NOT covered by unit tests.
# Every function must be either listed here or covered by a # Coverage: header
# in a unit test file. The runner's default coverage scan and test 1990 enforce
# this.
#
# Category codes used:
#   cmd-entrypoint = tested by integration tests in tests/integration-tests/
#   trivial        = one-liner delegation to another function (tested via that function)
#   pure           = simple logic, no git/filesystem; could be tested but not yet
#   stateful       = depends on global variables, locks, caches, filesystem state
#   filesystem     = runs real git clone/push/checkout or creates real repos
#   arg-diff-mock  = calls same subcommand with different arguments; mock supports this
#   multi-step     = orchestrates 3+ subcommands; better tested by integration
#   completion     = shell completion generators; tested by test_3010
#   error-sink     = calls exit/die; tested by unit-test_1460

[untested]

